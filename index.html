<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eugéa — éditeur de cartes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23201a14'/><path d='M7 7h18v18H7z' fill='%23f3e6c4' stroke='%233b2816' stroke-width='3'/><path d='M7 16h9v9' fill='none' stroke='%233b2816' stroke-width='3'/></svg>" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand"><span class="logo"></span>Eugéa</div>
        <input id="mapName" type="text" spellcheck="false" title="Nom de la carte" />
        <div class="group">
          <button data-cmd="new" data-icon="new" class="icon" title="Nouvelle carte"></button>
          <button data-cmd="open" data-icon="open" class="icon" title="Ouvrir (Ctrl+O)"></button>
          <button data-cmd="save" data-icon="save" class="icon" title="Enregistrer (Ctrl+S)"></button>
        </div>
        <div class="group">
          <button data-cmd="undo" data-icon="undo" class="icon" title="Annuler (Ctrl+Z)"></button>
          <button data-cmd="redo" data-icon="redo" class="icon" title="Rétablir (Ctrl+Y)"></button>
        </div>
        <div class="group">
          <button data-cmd="generate" data-icon="dice" class="accent" title="Générateur aléatoire (Ctrl+G)">Générer</button>
          <button data-cmd="export" data-icon="export" class="primary" title="Exporter vers Foundry, Universal VTT ou image (Ctrl+E)">Exporter</button>
        </div>
        <div class="spacer"></div>
        <div class="group">
          <button data-cmd="grid" data-icon="grid" class="icon toggle" title="Grille (G)"></button>
          <button data-cmd="light" data-icon="sun" class="icon toggle" title="Aperçu de l'éclairage (I)"></button>
          <button data-cmd="roofs" data-icon="roof" class="icon toggle" title="Voir à travers les toits (K)"></button>
          <button data-cmd="player" data-icon="eye" class="icon toggle" title="Vue joueurs : cache portes secrètes, pièges et notes MJ (P)"></button>
          <button data-cmd="fit" data-icon="fit" class="icon" title="Recadrer (0)"></button>
        </div>
        <button data-cmd="help" data-icon="help" class="icon" title="Aide et raccourcis (?)"></button>
      </header>
      <nav id="toolbar"></nav>
      <main id="stage">
        <canvas id="view"></canvas>
        <div id="hint"></div>
      </main>
      <aside id="panel"></aside>
      <footer id="status"></footer>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
