# Crée une release à chaque tag vX.Y.Z avec eugea.html : l'éditeur complet en un seul fichier,
# utilisable hors-ligne. Le module Foundry a son propre dépôt (eugea-importer).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html eugea.html

      - uses: softprops/action-gh-release@v2
        with:
          files: eugea.html
          generate_release_notes: true
